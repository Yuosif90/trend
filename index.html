        let basePromptText = dbPrompts.base;
        let trendPromptText = "";
        let isTrendMode = false;

        function dbUpdatePrompt() {
            let finalStr = "";
            
            if (isTrendMode) {
                finalStr = trendPromptText;
            } else {
                finalStr = basePromptText;
                if (document.getElementById('dbAnim').checked) finalStr += document.getElementById('dbAnim').value;
                if (document.getElementById('dbRes8k').checked) finalStr += document.getElementById('dbRes8k').value;
                if (document.getElementById('dbBw').checked) finalStr += document.getElementById('dbBw').value;
                if (document.getElementById('dbColor').checked) finalStr += document.getElementById('dbColor').value;
                if (document.getElementById('dbNatureCheckbox').checked) finalStr += document.getElementById('dbNatureCheckbox').value;
                if (document.getElementById('dbSmooth').checked) finalStr += document.getElementById('dbSmooth').value;
            }
            
            document.getElementById('dbFinalPrompt').value = finalStr;
        }

        window.addEventListener('DOMContentLoaded', (event) => {
            // بەستنا هەموو دوگمەیێن پرۆمپتان ب جاڤاسکریپتی ڤە
            document.querySelectorAll('.db-btn-preset').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault(); 
                    
                    document.querySelectorAll('.db-btn-preset').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');

                    const promptKey = this.getAttribute('data-prompt-key');
                    
                    if(this.classList.contains('db-trend-btn')){
                        isTrendMode = true;
                        trendPromptText = dbPrompts[promptKey];
                    } else {
                        isTrendMode = false;
                        if(promptKey === 'base') {
                            basePromptText = dbPrompts.base;
                        } else {
                            basePromptText = dbPrompts[promptKey];
                        }
                    }
                    dbUpdatePrompt();
                });
            });

            // رێگریکرن ل Submit یێ شۆپیفای
            document.querySelectorAll('.db-container button').forEach(btn => {
                btn.addEventListener('click', function(e){
                    e.preventDefault();
                });
            });

            // چاڤدێریکرنا گوهۆڕینان ل بەشێ ئێکێ (چک بۆکس)
            document.querySelectorAll('.db-container input[type=checkbox]').forEach(el => {
                el.addEventListener('change', function() {
                    if(!isTrendMode) dbUpdatePrompt();
                });
            });

            // سیستەمێ مەزنکرنا وێنان (Modal)
            const modal = document.getElementById('dbImageModal');
            const modalImg = document.getElementById('dbModalImg');
            const closeModal = document.getElementById('dbModalClose');

            document.querySelectorAll('.db-btn-preset img').forEach(img => {
                img.addEventListener('click', function(e) {
                    e.stopPropagation(); 
                    modal.classList.add('show');
                    modalImg.src = this.src;
                });
            });

            closeModal.addEventListener('click', function() {
                modal.classList.remove('show');
            });

            modal.addEventListener('click', function(e) {
                if(e.target === modal) {
                    modal.classList.remove('show');
                }
            });

            // دوگمەیا کۆپیکرنێ
            const copyBtn = document.getElementById('dbCopyBtn');
            if (copyBtn) {
                copyBtn.addEventListener('click', function() {
                    dbUpdatePrompt();
                    let textToCopy = document.getElementById('dbFinalPrompt').value;
                    
                    navigator.clipboard.writeText(textToCopy).then(() => {
                        alert('✅ پرومپت ب سه‌ركه‌فتيانه‌ هاته‌ كۆپيكرن!\n\nنوكه‌ دشێي كليكا دكمێ "بچه‌ دناف Gemini دا" بكه‌ي و ل وێرێ Paste بكه‌ي.');
                    }).catch(err => {
                        let textArea = document.getElementById('dbFinalPrompt');
                        textArea.select();
                        try {
                            document.execCommand('copy');
                            alert('✅ پرومپت ب سه‌ركه‌فتيانه‌ هاته‌ كۆپيكرن!\n\nنوكه‌ دشێي كليكا دكمێ "بچه‌ دناف Gemini دا" بكه‌ي و ل وێرێ Paste بكه‌ي.');
                        } catch (err) {
                            alert('⚠️ كۆپيكرن سه‌ركه‌فتي نه‌بوو، ژكه‌ره‌ما خو ب ده‌ستي كۆپي بكه‌.');
                        }
                    });
                });
            }

            dbUpdatePrompt();
        });
        
        setTimeout(dbUpdatePrompt, 500);
    </script>
